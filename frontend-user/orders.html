<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 贵州红色旅游</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>.pay-opt:has(input:checked){border-color:var(--red) !important;background:#fff5f5}</style>
</head>
<body>
<header class="header">
    <div class="container header-inner">
        <a href="index.html" class="logo"><i class="fas fa-flag"></i> <span>贵州红色旅游</span></a>
        <nav class="nav">
            <a href="index.html" data-i18n="home">首页</a>
            <a href="spots.html" data-i18n="spots">景点</a>
            <a href="routes.html" data-i18n="routes">线路</a>
            <a href="culture.html" data-i18n="culture">红色文化</a>
            <a href="hotels.html" data-i18n="hotels">酒店</a>
            <a href="foods.html" data-i18n="foods">美食</a>
            <a href="faq.html" data-i18n="faq">客服</a>
        </nav>
        <div class="header-right">
            <div class="lang-switcher"><select id="langSelect" onchange="switchLang(this.value)"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div>
            <div id="userMenu"></div>
        </div>
    </div>
</header>

<div class="container">
    <div class="profile-layout">
        <div class="profile-sidebar">
            <div class="profile-sidebar-header">
                <div class="profile-avatar" id="sidebarAvatar"></div>
                <h3 id="sidebarName"></h3>
                <p id="sidebarPhone"></p>
            </div>
            <div class="profile-menu">
                <a href="profile.html"><i class="fas fa-user"></i><span>个人中心</span></a>
                <a href="favorites.html"><i class="fas fa-heart"></i><span>我的收藏</span></a>
                <a href="orders.html"><i class="fas fa-shopping-bag"></i><span>我的订单</span></a>
                <a href="messages.html"><i class="fas fa-bell"></i><span>消息通知</span></a>
                <a href="my-routes.html"><i class="fas fa-route"></i><span>我的线路</span></a>
                <a href="feedback.html"><i class="fas fa-bullhorn"></i><span>问题反馈</span></a>
            </div>
        </div>
        <div class="profile-content">
            <div class="profile-section-header">
                <span class="profile-section-header-title"><i class="fas fa-shopping-bag"></i>我的订单</span>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="switchStatus('')">全部</div>
                <div class="tab" onclick="switchStatus('PENDING')">待支付</div>
                <div class="tab" onclick="switchStatus('PAID')">已支付</div>
                <div class="tab" onclick="switchStatus('CANCELLED')">已取消</div>
                <div class="tab" onclick="switchStatus('REFUNDED')">已退款</div>
            </div>
            <div id="orderList"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="payModal">
    <div class="modal" style="position:relative">
        <span class="modal-close" onclick="closePayModal()">&times;</span>
        <h3>选择支付方式</h3>
        <div style="margin:24px 0">
            <div style="display:flex;gap:12px;margin-bottom:12px">
                <label class="pay-opt" style="flex:1;display:flex;align-items:center;gap:8px;padding:14px;border:2px solid var(--red);border-radius:var(--r);cursor:pointer;background:#fff5f5" onclick="selectPayMethod('WECHAT')">
                    <input type="radio" name="payMethod" value="WECHAT" checked>
                    <i class="fab fa-weixin" style="font-size:22px;color:#07c160"></i> 微信支付
                </label>
            </div>
            <p style="font-size:13px;color:var(--text2);margin-bottom:8px">银行卡支付：</p>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
                <label class="pay-opt" style="display:flex;align-items:center;gap:6px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px" onclick="selectPayMethod('BANK_ICBC')">
                    <input type="radio" name="payMethod" value="BANK_ICBC">
                    <i class="fas fa-university" style="color:#C41A1A"></i> 工商银行
                </label>
                <label class="pay-opt" style="display:flex;align-items:center;gap:6px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px" onclick="selectPayMethod('BANK_CCB')">
                    <input type="radio" name="payMethod" value="BANK_CCB">
                    <i class="fas fa-university" style="color:#003DA5"></i> 建设银行
                </label>
                <label class="pay-opt" style="display:flex;align-items:center;gap:6px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px" onclick="selectPayMethod('BANK_ABC')">
                    <input type="radio" name="payMethod" value="BANK_ABC">
                    <i class="fas fa-university" style="color:#009944"></i> 农业银行
                </label>
                <label class="pay-opt" style="display:flex;align-items:center;gap:6px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px" onclick="selectPayMethod('BANK_BOC')">
                    <input type="radio" name="payMethod" value="BANK_BOC">
                    <i class="fas fa-university" style="color:#C41A1A"></i> 中国银行
                </label>
                <label class="pay-opt" style="display:flex;align-items:center;gap:6px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px" onclick="selectPayMethod('BANK_BOCOM')">
                    <input type="radio" name="payMethod" value="BANK_BOCOM">
                    <i class="fas fa-university" style="color:#003976"></i> 交通银行
                </label>
                <label class="pay-opt" style="display:flex;align-items:center;gap:6px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px" onclick="selectPayMethod('BANK_CMB')">
                    <input type="radio" name="payMethod" value="BANK_CMB">
                    <i class="fas fa-university" style="color:#E60012"></i> 招商银行
                </label>
                <label class="pay-opt" style="display:flex;align-items:center;gap:6px;padding:10px 12px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px" onclick="selectPayMethod('BANK_PSBC')">
                    <input type="radio" name="payMethod" value="BANK_PSBC">
                    <i class="fas fa-university" style="color:#007236"></i> 邮储银行
                </label>
            </div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="confirmPay()">确认支付</button>
    </div>
</div>

<footer class="footer"><div class="container"><p>© 2026 贵州红色文化旅游景点信息管理系统</p></div></footer>

<script src="js/common.js"></script>
<script>
if (!requireLogin()) throw new Error('need login');

let currentStatus = '', payingOrderId = null, payMethod = 'WECHAT';

function renderSidebar() {
    const u = getUser();
    const initial = (u.nickname || u.username || '?').charAt(0).toUpperCase();
    document.getElementById('sidebarAvatar').textContent = initial;
    if (u.avatar) {
        document.getElementById('sidebarAvatar').innerHTML = '<img src="' + API + u.avatar + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.parentElement.textContent=\'' + initial + '\'">';
    }
    document.getElementById('sidebarName').textContent = u.nickname || u.username || '';
    document.getElementById('sidebarPhone').textContent = u.phone || '';
}

function getStatusBadge(status) {
    const map = {
        'PENDING': '<span class="status status-pending"><i class="fas fa-clock"></i> 待支付</span>',
        'PAID': '<span class="status status-paid"><i class="fas fa-check-circle"></i> 已支付</span>',
        'CANCELLED': '<span class="status status-closed"><i class="fas fa-times-circle"></i> 已取消</span>',
        'REFUNDED': '<span class="status" style="background:#f0f0f0;color:#999"><i class="fas fa-undo"></i> 已退款</span>',
        'COMPLETED': '<span class="status status-paid"><i class="fas fa-star"></i> 已完成</span>'
    };
    return map[status] || '<span class="status">' + status + '</span>';
}

function getOrderTypeName(type) {
    const map = { 'SPOT': '<i class="fas fa-mountain"></i> 景点', 'HOTEL': '<i class="fas fa-hotel"></i> 酒店', 'ROUTE': '<i class="fas fa-route"></i> 线路', 'FOOD': '<i class="fas fa-utensils"></i> 美食' };
    return map[type] ? '<span class="order-type-badge">' + map[type] + '</span>' : '';
}

function getOrderActions(order) {
    let html = '';
    if (order.status === 'PENDING') {
        html += '<button class="btn btn-outline btn-sm" onclick="cancelOrder(\'' + order.id + '\')"><i class="fas fa-times"></i> 取消</button>';
        html += '<button class="btn btn-primary btn-sm" onclick="openPayModal(\'' + order.id + '\')"><i class="fas fa-credit-card"></i> 立即支付</button>';
    } else if (order.status === 'PAID') {
        html += '<button class="btn btn-outline btn-sm" onclick="refundOrder(\'' + order.id + '\')"><i class="fas fa-undo"></i> 申请退款</button>';
    }
    return html;
}

function switchStatus(status) {
    currentStatus = status;
    document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
    const tabs = document.querySelectorAll('.tabs .tab');
    const idx = ['', 'PENDING', 'PAID', 'CANCELLED', 'REFUNDED'].indexOf(status);
    if (idx >= 0 && tabs[idx]) tabs[idx].classList.add('active');
    loadOrders(1);
}

const orderList = createPagedList({
    listId: 'orderList',
    paginationId: 'pagination',
    pageSize: 10,
    icon: 'fa-shopping-bag',
    emptyText: '暂无订单',
    fetchPage: page => api('/api/order/myList?page=' + page + '&size=10&orderType=&status=' + currentStatus),
    renderItem: o =>
        '<div class="order-card">' +
            '<div class="order-card-header">' +
                '<span class="order-no"><i class="fas fa-hashtag" style="margin-right:3px"></i>' + (o.orderNo || o.id || '') + '</span>' +
                getStatusBadge(o.status) +
            '</div>' +
            '<div class="order-card-body">' +
                '<div class="order-target-name">' + getOrderTypeName(o.orderType) + (o.targetName || '订单') + '</div>' +
                '<div class="order-meta-row">' +
                    '<div class="order-meta-item"><i class="fas fa-yen-sign"></i> <span>金额：</span><span class="order-amount">¥' + (o.amount || 0) + '</span></div>' +
                    '<div class="order-meta-item"><i class="fas fa-layer-group"></i> <span>数量：' + (o.quantity || 1) + '</span></div>' +
                    '<div class="order-meta-item"><i class="fas fa-calendar-alt"></i> <span>' + formatDate(o.createTime || o.createdAt) + '</span></div>' +
                '</div>' +
            '</div>' +
            (getOrderActions(o) ? '<div class="order-card-footer">' + getOrderActions(o) + '</div>' : '') +
        '</div>'
});
function loadOrders(page) { orderList.load(page); }

function selectPayMethod(method) { payMethod = method; document.querySelectorAll('.pay-opt').forEach(l => { var c = l.querySelector('input').value === method; l.style.borderColor = c ? 'var(--red)' : 'var(--border)'; l.style.background = c ? '#fff5f5' : ''; }); }

function openPayModal(orderId) {
    payingOrderId = orderId;
    payMethod = 'WECHAT';
    document.querySelector('input[value="WECHAT"]').checked = true;
    document.getElementById('payModal').classList.add('show');
}

function closePayModal() { document.getElementById('payModal').classList.remove('show'); payingOrderId = null; }

async function confirmPay() {
    if (!payingOrderId) return;
    const data = await api('/api/order/pay?orderId=' + payingOrderId + '&payMethod=' + payMethod);
    if (data !== null) {
        payingOrderId = null;
        closePayModal();
        showToast('支付成功');
        loadOrders(orderList.getPage());
    }
}

function cancelOrder(id) {
    showConfirm('确定取消该订单？取消后不可恢复。', async () => {
        const data = await api('/api/order/cancel?orderId=' + id);
        if (data !== null) { showToast('订单已取消'); loadOrders(orderList.getPage()); }
    });
}

function refundOrder(id) {
    showConfirm('确定申请退款？退款将在3-5个工作日内到账。', async () => {
        const data = await api('/api/order/refund?orderId=' + id);
        if (data !== null) { showToast('退款申请已提交'); loadOrders(orderList.getPage()); }
    });
}

renderSidebar();
loadOrders(1);
</script>
</body>
</html>
